<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>保險客戶 CRM 雛形</title>
<style>
:root{--bg:#f1e8dc;--card:#fbf6ef;--tx:#3b2e25;--mu:#7a6757;--ac:#8b5e3c;--ac2:#e8d8c4;--bd:#dccbb6;--wr:#9a5b12;--wr2:#f6e3c2;--dn:#b3261e;--dn2:#f8dcd6;--ok:#1d6b45;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#231b15;--card:#2f251d;--tx:#f0e6da;--mu:#bfae9c;--ac:#d9ad7f;--ac2:#43352a;--bd:#4a3b2f;--wr:#f0b45c;--wr2:#44331c;--dn:#f19a93;--dn2:#45231f;--ok:#7fd0a1;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#231b15;--card:#2f251d;--tx:#f0e6da;--mu:#bfae9c;--ac:#d9ad7f;--ac2:#43352a;--bd:#4a3b2f;--wr:#f0b45c;--wr2:#44331c;--dn:#f19a93;--dn2:#45231f;--ok:#7fd0a1;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:17px;margin:20px 0 8px}
.note{background:var(--wr2);color:var(--wr);border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:8px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mu{color:var(--mu);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat b{display:block;font-size:26px;line-height:1.2}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
.strip div{background:var(--ac2);border-radius:8px;text-align:center;padding:8px 0;font-size:12px;color:var(--mu)}
.strip div b{display:block;font-size:18px;color:var(--tx)}
.strip div.hot{background:var(--wr2)}.strip div.hot b{color:var(--wr)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--ac2);color:var(--ac)}
.tag.w{background:var(--wr2);color:var(--wr)}.tag.d{background:var(--dn2);color:var(--dn)}
button,input,select,textarea{font:inherit;color:var(--tx)}
button{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 14px;min-height:44px;cursor:pointer}
button.pri{background:var(--ac);color:var(--card);border-color:var(--ac)}
button.sm{min-height:36px;padding:4px 10px;font-size:14px}
button.dg{color:var(--dn)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
label{display:block;font-size:14px;color:var(--mu);margin:10px 0 2px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;min-height:44px}
.err{color:var(--dn);font-size:14px;margin-top:8px;min-height:20px}
nav{overflow-x:auto;position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1 0 auto;min-width:56px;padding:0 6px;border:0;border-radius:0;background:none;color:var(--mu);min-height:56px;font-size:14px}
nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 3px 0 var(--ac)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
#sheet.open{display:flex}
#sheet>div{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;display:none;z-index:9}
.empty{text-align:center;color:var(--mu);padding:28px 8px}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script></head><body>
<main id="app"></main>
<div id="sheet"><div id="sheetBody"></div></div>
<div id="toast"></div>
<nav id="nav"></nav>
<script>
let TYPES=["車險","火險","旅平險","醫療險","其他險種"];
try{const r=localStorage.getItem("crm_proto_types");if(r){const a=JSON.parse(r);if(Array.isArray(a))TYPES=a}}catch(e){}
const STATUS=["草稿","待生效","有效","續保洽談中","已續保","已到期","已取消","不續保"];
const LIVE=["有效","續保洽談中"];
const STEPS=[90,60,30,14,7,3,1];
let S={c:[],p:[]},tab="home",armed=null;
try{const r=localStorage.getItem("crm_proto_v1");if(r)S=JSON.parse(r)}catch(e){}
S.h=S.h||[];S.r=S.r||[];S.l=S.l||[];S.o=S.o||[];S.y=S.y||[];S.k=S.k||[];S.a=S.a||[];S.b=S.b||[];
function save(){try{localStorage.setItem("crm_proto_v1",JSON.stringify(S))}catch(e){toast("無法儲存到瀏覽器，資料將在關閉後消失")}}
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fd=d=>d?d.replaceAll("-","/"):"";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const T0=()=>{const t=new Date();t.setHours(0,0,0,0);return t};
const dl=d=>Math.round((new Date(d+"T00:00:00")-T0())/864e5);
function bday(b){const[,m,d]=b.split("-").map(Number),y=T0().getFullYear();
 const mk=y=>{let x=new Date(y,m-1,d);if(m==2&&d==29&&x.getMonth()!=1)x=new Date(y,1,28);return x};
 let n=mk(y);if(n<T0())n=mk(y+1);return Math.round((n-T0())/864e5)}
const mask=id=>id?id.slice(0,3)+"＊＊＊＊"+id.slice(-3):"";
const cn=id=>(S.c.find(c=>c.id===id)||{}).name||"（已刪除客戶）";
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2200)}
function step(n){return STEPS.slice().reverse().find(s=>n<=s)}
function due(){return S.p.filter(p=>LIVE.includes(p.status)&&p.end).map(p=>({p,n:dl(p.end)})).filter(x=>x.n<=90).sort((a,b)=>a.n-b.n)}
function bds(){return S.c.filter(c=>c.birth).map(c=>({c,n:bday(c.birth)})).filter(x=>x.n<=30).sort((a,b)=>a.n-b.n)}
function dayTag(n){return n<0?`<span class="tag d">已逾期 ${-n} 天</span>`:n===0?`<span class="tag d">今天到期</span>`:`<span class="tag ${n<=30?"w":""}">剩 ${n} 天</span>`}

function home(){
 const d=due(),b=bds(),cnt=s=>d.filter(x=>x.n>=0&&x.n<=s).length;
 const strip=STEPS.slice().reverse().map((s,i,a)=>{const lo=i?a[i-1]:-1,k=d.filter(x=>x.n>lo&&x.n<=s).length;return `<div class="${s<=30&&k?"hot":""}"><b>${k}</b>${s} 天</div>`}).join("");
 return `<h1>首頁</h1><div class="mu">${fd(new Date().toLocaleDateString("sv"))}</div>
 <div class="note">這是畫面雛形。資料只存在這支手機的瀏覽器，不會上傳。請勿輸入真實客戶資料。</div>
 <div class="grid"><div class="card stat"><b>${S.c.length}</b>客戶總數</div><div class="card stat"><b>${S.p.filter(p=>p.status==="有效").length}</b>有效保單</div>
 <div class="card stat"><b>${cnt(30)}</b>30 天內到期</div><div class="card stat"><b>${cnt(90)}</b>90 天內到期</div><div class="card stat"><b>${S.h.length}</b>家庭群組</div><div class="card stat"><b>${b.length}</b>30 天內生日</div><div class="card stat"><b>${todoC().length}</b>待聯絡客戶</div><div class="card stat"><b>${S.l.length}</b>聯絡紀錄</div><div class="card stat"><b>${S.o.filter(o=>OPENS(o.stage)).length}</b>進行中機會</div><div class="card stat"><b>${odO().length}</b>逾期業務機會</div></div>
 <h2>到期時間軸</h2><div class="mu">依提醒天數分組，只計算有效與續保洽談中的保單</div><div class="strip">${strip}</div>
 <h2>近期生日（30 天內）</h2>${b.length?b.map(x=>`<div class="card row"><span>${esc(x.c.name)}</span><span class="tag">${x.n===0?"今天":x.n+" 天後"}</span></div>`).join(""):`<div class="empty">30 天內沒有生日</div>`}${homeExtra()}`}

function custs(){return `<div class="row"><h1>客戶</h1><button class="pri" onclick="fc()">新增客戶</button></div>
 <input id="q" placeholder="搜尋姓名、手機、地址、公司、統編、身分證" oninput="drawList()" style="margin:8px 0">
 <select id="cf" onchange="drawList()"><option value="">全部客戶</option><option value="birth">缺出生年月日</option><option value="phone">缺手機</option><option value="addr">缺地址</option><option value="idno">缺身分證字號</option></select><div id="list" style="margin-top:8px"></div>`}
function drawList(){const q=((document.getElementById("q")||{}).value||"").trim().toUpperCase(),f=(document.getElementById("cf")||{}).value||"",el=document.getElementById("list");if(!el)return;
 const r=S.c.filter(c=>(!q||[c.name,c.phone,c.addr,c.company,c.taxId,c.email].some(x=>(x||"").toUpperCase().includes(q))||c.idno===q)&&(!f||!c[f]));
 el.innerHTML=(f?`<div class="mu">符合 ${r.length} 位</div>`:"")+(r.length?r.map(c=>`<div class="card"><div class="row"><b>${esc(c.name)}</b><span class="tag">${c.hid?esc((S.h.find(h=>h.id===c.hid)||{}).name)+"　":""}${S.p.filter(p=>p.cid===c.id||(p.ins||[]).includes(c.id)).length} 張相關保單</span></div>
 <div class="mu">${esc(mask(c.idno))} ${esc(c.phone||"")} ${c.birth?"生日 "+fd(c.birth):""}${c.hasSeal?"　有印章":""}</div>
 ${c.addr?`<div class="mu">${esc(c.addr)}</div>`:""}${c.company?`<div class="mu">${esc(c.company)}${c.taxId?"　統編 "+esc(c.taxId):""}</div>`:""}${c.occ||c.email?`<div class="mu">${esc(c.occ||"")} ${esc(c.email||"")}</div>`:""}
 ${c.refName?`<div class="mu">介紹人 ${esc(c.refName)} ${esc(c.refPhone||"")}</div>`:""}${c.cName?`<div class="mu">聯絡人 ${esc(c.cName)} ${esc(c.cPhone||"")} ${esc(c.cRel||"")}</div>`:""}${c.note?`<div class="mu">${esc(c.note)}</div>`:""}
 <div style="margin-top:8px"><button class="sm" onclick="fl('','${c.id}')">記錄聯絡</button> <button class="sm" onclick="fc('${c.id}')">編輯</button> <button class="sm dg" onclick="del('c','${c.id}')">${armed==="c"+c.id?"再按一次刪除":"刪除"}</button></div></div>`).join(""):`<div class="empty">${S.c.length?"找不到符合的客戶":"還沒有客戶，先新增第一位"}</div>`)}
const insPlain=p=>((p.ins&&p.ins.length)?p.ins:[p.cid]).map(cn).join(" ");
function pols(){return `<div class="row"><h1>保單</h1><button class="pri" onclick="fp()">新增保單</button></div><input id="pq" placeholder="搜尋要保人、被保險人、保單號碼、車牌、公司" oninput="drawPols()" style="margin:8px 0"><div id="pl"></div>`}
function drawPols(){const q=((document.getElementById("pq")||{}).value||"").trim().toUpperCase(),el=document.getElementById("pl");if(!el)return;
 const r=S.p.filter(p=>!q||[cn(p.cid),insPlain(p),p.no,p.plate,p.co,p.type,p.addr].some(x=>(x||"").toUpperCase().includes(q)));
 el.innerHTML=r.length?r.map(p=>{const h=S.c.find(x=>x.id===p.cid);return `<div class="card"><div class="row"><b>要保人 ${esc(cn(p.cid))}</b><span class="tag">${esc(p.type)}</span></div>
 ${h&&h.phone?`<div class="mu">要保人手機 ${esc(h.phone)}</div>`:""}<div class="mu">${esc(p.co)} ${esc(p.no)}</div><div class="mu">被保險人：${insTxt(p)}</div><div class="mu">${fd(p.start)} 至 ${fd(p.end)}　NT$ ${Number(p.fee||0).toLocaleString("zh-TW")}</div>
 <div class="mu">${esc(p.status)}${p.plate?"　車牌 "+esc(p.plate):""}${p.pcn?"　"+esc(p.pcn):""}</div>
 ${p.addr||p.area||p.grade?`<div class="mu">建築 ${esc(p.addr||"")}${p.area?"　"+esc(p.area)+" 坪":""}${p.byear?"　"+esc(p.byear)+" 年":""}${p.struct?"　"+esc(p.struct):""}${p.floors?"　"+esc(p.floors)+" 層":""}${p.grade?"　等級 "+esc(p.grade):""}</div>`:""}
 ${p.bk?`<div class="mu">抵押銀行 ${esc(p.bk)}${p.bka?"　寄送地址 "+esc(p.bka):""}</div>`:""}${p.bn?`<div class="mu">${esc(p.bn)}</div>`:""}
 <div style="margin-top:8px"><button class="sm" onclick="fp('${p.id}')">編輯</button> <button class="sm dg" onclick="del('p','${p.id}')">${armed==="p"+p.id?"再按一次刪除":"刪除"}</button></div></div>`}).join(""):`<div class="empty">${S.p.length?"找不到符合的保單":"還沒有保單，請先新增客戶再建立保單"}</div>`}
function rem(){const d=due(),oo=S.o.filter(o=>OPENS(o.stage)&&o.next&&dl(o.next)<=7).map(o=>({o,n:dl(o.next)})).sort((a,b)=>a.n-b.n),td=todoC();
 return `<h1>提醒中心</h1><h2>續保提醒</h2><div class="mu">到期前 90、60、30、14、7、3、1 天；已續保、已取消、不續保的保單不會出現</div>
 ${d.length?d.map(x=>`<div class="card"><div class="row"><b>${esc(cn(x.p.cid))}</b>${dayTag(x.n)}</div>
 <div class="mu">${esc(x.p.type)}　${esc(x.p.co)} ${esc(x.p.no)}　被保險人：${insTxt(x.p)}</div><div class="mu">到期 ${fd(x.p.end)}　${x.n>=0?"目前在 "+step(x.n)+" 天提醒區間　":""}${esc(x.p.status)}</div></div>`).join(""):`<div class="empty">90 天內沒有需要處理的到期保單</div>`}
 <h2>業務機會提醒</h2><div class="mu">進行中的機會，下次聯絡日期在 7 天內或已逾期；與保單到期提醒分開管理</div>
 ${oo.length?oo.map(x=>`<div class="card"><div class="row"><b>${esc(cn(x.o.cid))}</b><span class="tag ${x.n<0?"d":"w"}">${x.n<0?"逾期 "+(-x.n)+" 天":x.n===0?"今天":x.n+" 天後"}</span></div>
 <div class="mu">${esc(x.o.type)}　${esc(x.o.stage)}　預估保費 NT$ ${Number(x.o.fee||0).toLocaleString("zh-TW")}</div><div class="mu">下次聯絡 ${fd(x.o.next)}${x.o.target?"　預計 "+fd(x.o.target):""}</div></div>`).join(""):`<div class="empty">目前沒有需要處理的業務機會</div>`}
 <h2>待聯絡客戶</h2><div class="mu">依每位客戶最新聯絡紀錄的下次聯絡日期計算</div>
 ${td.length?td.map(x=>`<div class="card"><div class="row"><b>${esc(x.c.name)}</b><span class="tag ${x.n<0?"d":"w"}">${x.n<0?"逾期 "+(-x.n)+" 天":"今天"}</span></div><div class="mu">${esc(x.l.todo||x.l.topic)}</div><div style="margin-top:6px"><button class="sm" onclick="fl('','${x.c.id}')">記錄聯絡</button></div></div>`).join(""):`<div class="empty">今天沒有待聯絡的客戶</div>`}`}
const sheet=h=>{document.getElementById("sheetBody").innerHTML=h;document.getElementById("sheet").classList.add("open")};
const closeS=()=>document.getElementById("sheet").classList.remove("open");
document.getElementById("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeS()});
const v=id=>document.getElementById(id).value.trim();
const opt=(a,s)=>a.map(x=>`<option ${x===s?"selected":""}>${x}</option>`).join("");

function fc(id){const c=S.c.find(x=>x.id===id)||{},I=(k,l,x="")=>`<label>${l}</label><input id="${k}" value="${esc(c[k.slice(1)])}" ${x}>`;
 sheet(`<h1>${id?"編輯客戶":"新增客戶"}</h1><h2>基本資料</h2>
 <label>客戶姓名（必填）</label><input id="n" value="${esc(c.name)}">
 <label>身分證字號</label><input id="i" value="${esc(c.idno)}" maxlength="10" autocapitalize="characters">
 <label>出生年月日</label><input id="b" type="date" value="${esc(c.birth)}">
 <label>手機</label><input id="ph" inputmode="tel" value="${esc(c.phone)}">
 <label>Email</label><input id="em" type="email" value="${esc(c.email)}">
 <label>地址</label><input id="ad" value="${esc(c.addr)}">
 <label>職業</label><input id="oc" value="${esc(c.occ)}">
 <label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="se" style="width:auto;min-height:0" ${c.hasSeal?"checked":""}>有印章</label>
 <h2>公司資料</h2><label>公司名稱</label><input id="co" value="${esc(c.company)}"><label>統一編號（8 碼）</label><input id="tx" inputmode="numeric" maxlength="8" value="${esc(c.taxId)}">
 <h2>介紹人與聯絡人</h2><label>介紹人姓名</label><input id="rn" value="${esc(c.refName)}"><label>介紹人手機</label><input id="rp" inputmode="tel" value="${esc(c.refPhone)}">
 <label>主要聯絡人</label><input id="cn1" value="${esc(c.cName)}"><label>聯絡人電話</label><input id="cp" inputmode="tel" value="${esc(c.cPhone)}"><label>與客戶的關係</label><input id="cr" value="${esc(c.cRel)}">
 <label>備註與喜好</label><textarea id="nt" rows="3">${esc(c.note)}</textarea>
 <div class="err" id="e"></div><div class="row"><button onclick="closeS()">取消</button><button class="pri" onclick="sc('${id||""}')">儲存客戶</button></div>`)}
function sc(id){const o={name:v("n"),idno:v("i").toUpperCase(),birth:v("b"),phone:v("ph"),email:v("em"),addr:v("ad"),occ:v("oc"),hasSeal:document.getElementById("se").checked,company:v("co"),taxId:v("tx"),refName:v("rn"),refPhone:v("rp"),cName:v("cn1"),cPhone:v("cp"),cRel:v("cr"),note:v("nt")},e=document.getElementById("e");
 if(!o.name)return e.textContent="請填寫客戶姓名";
 if(o.idno&&!/^[A-Z][12]\d{8}$/.test(o.idno))return e.textContent="身分證字號格式不正確，應為 1 個英文字母加 9 碼數字";
 if(o.taxId&&!/^\d{8}$/.test(o.taxId))return e.textContent="統一編號應為 8 碼數字";
 if(o.email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(o.email))return e.textContent="Email 格式不正確";
 const dup=o.idno&&S.c.find(c=>c.idno===o.idno&&c.id!==id);if(dup&&!confirmDup(dup))return e.textContent=`已有相同身分證字號的客戶：${dup.name}。如確定要建立，請再按一次儲存`;
 if(id)Object.assign(S.c.find(c=>c.id===id),o);else S.c.push({id:uid(),...o});
 dupArm=null;save();closeS();toast("客戶已儲存");draw()}
let dupArm=null;function confirmDup(d){if(dupArm===d.id)return true;dupArm=d.id;return false}

function fp(id){if(!S.c.length)return toast("請先新增客戶");if(!TYPES.length)return toast("請先到設定新增險種");const p=S.p.find(x=>x.id===id)||{type:TYPES[0],status:"草稿"};const ins=p.ins||[],same=!ins.length||(ins.length===1&&ins[0]===p.cid);
 const T=(k,l,x="")=>`<label>${l}</label><input id="${k}" value="${esc(p[x||k])}">`;
 sheet(`<h1>${id?"編輯保單":"新增保單"}</h1>
 <label>要保人（必填）</label>${cpick("c",p.cid)}
 <label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="same" style="width:auto;min-height:0" onchange="ts()" ${same?"checked":""}>被保險人與要保人相同</label>

<h2>備份與還原</h2><div class="card"><button class="pri" onclick="doBackup()">下載 JSON 備份</button><div class="mu" style="margin-top:8px">還原會覆蓋目前所有資料。</div><label>選擇備份檔</label><input type="file" accept=".json,application/json" onchange="pickRestore(this.files[0])">
${RS?`<div class="mu" style="margin-top:8px">備份時間 ${esc(RS.at||"未知")}：客戶 ${RS.d.c.length}、保單 ${RS.d.p.length}、家庭 ${RS.d.h.length}、聯絡 ${RS.d.l.length}、機會 ${RS.d.o.length}</div><button class="dg" style="margin-top:8px" onclick="doRestore()">${armed==="rs"?"再按一次確認覆蓋":"還原此備份"}</button>`:""}</div>
<h2>匯出 CSV</h2><div class="card"><label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" style="width:auto;min-height:0" ${XF?"checked":""} onchange="XF=this.checked;armed=null">匯出完整身分證（預設遮罩）</label><div style="margin-top:8px"><button onclick="exCSV('c')">${armed==="xf"?"再按一次確認匯出":"匯出客戶"}</button> <button onclick="exCSV('p')">匯出保單</button></div><div class="mu" style="margin-top:8px">以 = + - @ 開頭的內容會自動加上前綴，防止 Excel 公式注入。</div></div>
<h2>Excel 匯入客戶</h2><div class="card">${imp()}</div>
<h2>操作紀錄</h2>${S.a.length?S.a.slice(-8).reverse().map(a=>`<div class="mu">${esc(a.at)}　${esc(a.act)}</div>`).join(""):`<div class="mu">尚無紀錄</div>`}`}
const STAGES=["新機會","聯絡中","需求確認","報價中","等待客戶決定","待補件","已成交","未成交","暫緩追蹤"],CLOSED=["已成交","未成交"],OPENS=s=>!CLOSED.includes(s)&&s!=="暫緩追蹤";
function odO(){return S.o.filter(o=>OPENS(o.stage)&&o.next&&dl(o.next)<0)}
function opps(){const od=odO().length,r=S.o.slice().sort((a,b)=>(CLOSED.includes(a.stage)?1:0)-(CLOSED.includes(b.stage)?1:0)||(a.next||"9999").localeCompare(b.next||"9999"));
 return `<div class="row"><h1>業務機會</h1><button class="pri" onclick="fo()">新增機會</button></div><div class="mu">業務機會與保單到期提醒分開管理；標為已成交不會自動建立保單。</div>${od?`<div class="note">有 ${od} 筆機會的下次聯絡日期已逾期</div>`:""}`+(r.length?r.map(o=>{const late=OPENS(o.stage)&&o.next&&dl(o.next)<0;return `<div class="card"><div class="row"><b>${esc(cn(o.cid))}</b><span class="tag ${o.stage==="已成交"?"":o.stage==="未成交"?"d":"w"}">${esc(o.stage)}</span></div>
<div class="mu">${esc(o.type)}　預估保費 NT$ ${Number(o.fee||0).toLocaleString("zh-TW")}${o.prob?"　成交機率 "+esc(o.prob)+"%":""}</div>
<div class="mu">${o.target?"預計日期 "+fd(o.target):""}${o.next?"　下次聯絡 "+fd(o.next):""}${late?`　<span class="tag d">逾期 ${-dl(o.next)} 天</span>`:""}</div>
${o.stage==="已成交"&&o.result?`<div class="mu">成交結果：${esc(o.result)}</div>`:""}${o.stage==="未成交"&&o.reason?`<div class="mu">未成交原因：${esc(o.reason)}</div>`:""}${o.note?`<div class="mu">${esc(o.note)}</div>`:""}
<div style="margin-top:8px"><button class="sm" onclick="fo('${o.id}')">編輯</button> <button class="sm dg" onclick="del('o','${o.id}')">${armed==="o"+o.id?"再按一次刪除":"刪除"}</button></div></div>`}).join(""):`<div class="empty">還沒有業務機會</div>`)}
function fo(id){if(!S.c.length)return toast("請先新增客戶");if(!TYPES.length)return toast("請先到設定新增險種");const o=S.o.find(x=>x.id===id)||{type:TYPES[0],stage:"新機會"};
 sheet(`<h1>${id?"編輯業務機會":"新增業務機會"}</h1><label>客戶（必填）</label>${cpick("oc",o.cid)}
 <label>預計險種</label><select id="ot">${opt(TYPES.includes(o.type)?TYPES:[...TYPES,o.type],o.type)}</select>
 <label>預計到期日或成交日</label><input id="od" type="date" value="${esc(o.target)}">
 <label>預估保費（新臺幣）</label><input id="ofee" inputmode="numeric" value="${esc(o.fee)}">
 <label>業務階段</label><select id="ost" onchange="og2()">${opt(STAGES,o.stage)}</select>
 <label>下次聯絡日期</label><input id="onx" type="date" value="${esc(o.next)}">
 <label>成交機率（選填，0 到 100）</label><input id="opr" inputmode="numeric" value="${esc(o.prob)}">
 <div id="orw"><label>成交結果</label><input id="ore" value="${esc(o.result)}" placeholder="例如：實際保費、保單號碼"></div>
 <div id="orsw"><label>未成交原因（必填）</label><input id="ors" value="${esc(o.reason)}"></div>
 <label>備註</label><textarea id="onote" rows="2">${esc(o.note)}</textarea>
 <div class="err" id="e"></div><div class="row"><button onclick="closeS()">取消</button><button class="pri" onclick="sob('${id||""}')">儲存機會</button></div>`);og2()}
function og2(){const s=v("ost");document.getElementById("orw").style.display=s==="已成交"?"":"none";document.getElementById("orsw").style.display=s==="未成交"?"":"none"}
function sob(id){const s=v("ost"),o={cid:v("oc"),type:v("ot"),target:v("od"),fee:v("ofee").replace(/,/g,""),stage:s,next:v("onx"),prob:v("opr"),result:s==="已成交"?v("ore"):"",reason:s==="未成交"?v("ors"):"",note:v("onote")},e=document.getElementById("e");
 if(o.fee&&!/^\d+$/.test(o.fee))return e.textContent="預估保費請輸入整數數字";
 if(o.prob!==""&&(!/^\d+$/.test(o.prob)||+o.prob>100))return e.textContent="成交機率請輸入 0 到 100 的整數";
 if(s==="未成交"&&!o.reason)return e.textContent="未成交需填寫原因";
 if(id)Object.assign(S.o.find(x=>x.id===id),o);else S.o.push({id:uid(),...o});save();closeS();toast("業務機會已儲存");draw()}
const WAYS=["電話","LINE","Email","面談","其他"];
function todoC(){return S.c.map(c=>{const l=S.l.filter(x=>x.cid===c.id).sort((a,b)=>b.at.localeCompare(a.at))[0];return l&&l.next?{c,l,n:dl(l.next)}:null}).filter(x=>x&&x.n<=0).sort((a,b)=>a.n-b.n)}
const lcard=(l,a)=>{const p=S.p.find(x=>x.id===l.pid),ob=S.o.find(x=>x.id===l.oid);return `<div class="card"><div class="row"><b>${esc(cn(l.cid))}</b><span class="tag">${esc(l.way)}</span></div>
<div class="mu">${fd(l.at.slice(0,10))} ${l.at.slice(11,16)}　${esc(l.topic)}</div>
${l.content?`<div style="white-space:pre-wrap">${esc(l.content)}</div>`:""}${l.reply?`<div class="mu">客戶回覆：${esc(l.reply)}</div>`:""}${l.todo?`<div class="mu">待辦：${esc(l.todo)}</div>`:""}${l.next?`<div class="mu">下次聯絡：${fd(l.next)}</div>`:""}${p?`<div class="mu">關聯保單：${esc(p.type)} ${esc(p.no)}</div>`:""}${ob?`<div class="mu">關聯業務機會：${esc(ob.type)} ${esc(ob.stage)}</div>`:""}
${a?`<div style="margin-top:8px"><button class="sm" onclick="fl('${l.id}')">編輯</button> <button class="sm dg" onclick="del('l','${l.id}')">${armed==="l"+l.id?"再按一次刪除":"刪除"}</button></div>`:""}</div>`};
function homeExtra(){const td=todoC(),rc=S.l.slice().sort((a,b)=>b.at.localeCompare(a.at)).slice(0,3);
 return `<h2>今日待聯絡客戶</h2><div class="mu">依每位客戶最新一筆紀錄的下次聯絡日期計算</div>${td.length?td.map(x=>`<div class="card"><div class="row"><b>${esc(x.c.name)}</b><span class="tag ${x.n<0?"d":"w"}">${x.n<0?"逾期 "+(-x.n)+" 天":"今天"}</span></div><div class="mu">${esc(x.l.todo||x.l.topic)}</div><div style="margin-top:6px"><button class="sm" onclick="fl('','${x.c.id}')">記錄聯絡</button></div></div>`).join(""):`<div class="empty">今天沒有待聯絡的客戶</div>`}
<h2>近期聯絡紀錄</h2>${rc.length?rc.map(l=>lcard(l,false)).join(""):`<div class="empty">還沒有聯絡紀錄</div>`}`}
function logs(){return `<div class="row"><h1>聯絡紀錄</h1><button class="pri" onclick="fl()">新增紀錄</button></div><input id="lq" placeholder="搜尋客戶、主題、內容" oninput="drawLogs()" style="margin:8px 0"><div id="ll"></div>`}
function drawLogs(){const q=(document.getElementById("lq")||{}).value||"",el=document.getElementById("ll");if(!el)return;
 const r=S.l.filter(l=>!q||cn(l.cid).includes(q)||(l.topic||"").includes(q)||(l.content||"").includes(q)).sort((a,b)=>b.at.localeCompare(a.at));
 el.innerHTML=r.length?r.map(l=>lcard(l,true)).join(""):`<div class="empty">${S.l.length?"找不到符合的紀錄":"還沒有聯絡紀錄"}</div>`}
function fl(id,cid){if(!S.c.length)return toast("請先新增客戶");const l=S.l.find(x=>x.id===id)||{cid:cid||S.c[0].id,at:new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16),way:"電話"};
 sheet(`<h1>${id?"編輯聯絡紀錄":"新增聯絡紀錄"}</h1><label>客戶（必填）</label>${cpick("lc",l.cid,"lpo()")}
 <label>聯絡日期及時間</label><input id="la" type="datetime-local" value="${esc(l.at)}">
 <label>聯絡方式</label><select id="lw">${opt(WAYS,l.way)}</select>
 <label>聯絡主題（必填）</label><input id="lt" value="${esc(l.topic)}">
 <label>聯絡內容</label><textarea id="lb" rows="3">${esc(l.content)}</textarea>
 <label>客戶回覆</label><textarea id="lr" rows="2">${esc(l.reply)}</textarea>
 <label>後續待辦</label><input id="ld" value="${esc(l.todo)}">
 <label>下次聯絡日期（填寫後會出現在待聯絡清單）</label><input id="ln" type="date" value="${esc(l.next)}">
 <label>關聯保單</label><select id="lp"></select>
 <label>關聯業務機會</label><select id="lo"></select>
 <div class="err" id="e"></div><div class="row"><button onclick="closeS()">取消</button><button class="pri" onclick="sl('${id||""}')">儲存紀錄</button></div>`);lpo(l.pid,l.oid)}
function lpo(sel,so){const c=v("lc");document.getElementById("lo").innerHTML=`<option value="">不關聯</option>`+S.o.filter(x=>x.cid===c).map(x=>`<option value="${x.id}" ${x.id===so?"selected":""}>${esc(x.type)} ${esc(x.stage)}</option>`).join("");const ps=S.p.filter(p=>p.cid===c||(p.ins||[]).includes(c));document.getElementById("lp").innerHTML=`<option value="">不關聯</option>`+ps.map(p=>`<option value="${p.id}" ${p.id===sel?"selected":""}>${esc(p.type)} ${esc(p.no)}</option>`).join("")}
function sl(id){const o={cid:v("lc"),at:v("la"),way:v("lw"),topic:v("lt"),content:v("lb"),reply:v("lr"),todo:v("ld"),next:v("ln"),pid:v("lp"),oid:v("lo")},e=document.getElementById("e");
 if(!o.at)return e.textContent="請填寫聯絡日期及時間";if(!o.topic)return e.textContent="請填寫聯絡主題";
 if(o.next&&o.next<o.at.slice(0,10))return e.textContent="下次聯絡日期不能早於本次聯絡日期";
 if(id)Object.assign(S.l.find(l=>l.id===id),o);else S.l.push({id:uid(),...o});save();closeS();toast("聯絡紀錄已儲存");draw()}
function saveT(){try{localStorage.setItem("crm_proto_types",JSON.stringify(TYPES))}catch(e){toast("無法儲存到瀏覽器")}}
function setts(){const cb=(i,k,l)=>`<label style="display:flex;gap:8px;align-items:center;color:var(--tx);margin:4px 0"><input type="checkbox" style="width:auto;min-height:0" ${(TF[TYPES[i]]||{})[k]?"checked":""} onchange="tfSet(${i},'${k}',this.checked)">${l}</label>`;
 return `<h1>設定</h1><h2>險種管理</h2><div class="mu">可自由新增或刪除險種，並勾選每個險種要顯示的欄位。已有保單使用的險種無法刪除。</div>
<div class="card">${TYPES.length?TYPES.map((t,i)=>`<div style="padding:6px 0;border-bottom:1px solid var(--bd)"><div class="row"><span><b>${esc(t)}</b> <span class="mu">${S.p.filter(p=>p.type===t).length} 張</span></span><button class="sm dg" onclick="delT(${i})">${armed==="t"+i?"再按一次刪除":"刪除"}</button></div>${cb(i,"plate","顯示車牌欄位")}${cb(i,"bld","顯示建物欄位（地址、坪數、年份、構造、樓層、等級、抵押銀行）")}</div>`).join(""):`<div class="empty">目前沒有險種，請先新增</div>`}</div>
<div class="row" style="margin-top:8px"><input id="nt2" placeholder="輸入新險種名稱" maxlength="20"><button class="pri" onclick="addT()" style="white-space:nowrap">新增險種</button></div><div class="err" id="e"></div>`}
function tfSet(i,k,on){const t=TYPES[i];TF[t]=TF[t]||{};TF[t][k]=on?1:0;saveTF()}
function addT(){const n=v("nt2"),e=document.getElementById("e");if(!n)return e.textContent="請輸入險種名稱";if(TYPES.includes(n))return e.textContent="已有相同名稱的險種";TYPES.push(n);saveT();toast("險種已新增");draw()}
function delT(i){const t=TYPES[i],k=S.p.filter(p=>p.type===t).length;if(k)return toast(`有 ${k} 張保單使用「${t}」，無法刪除`);if(armed==="t"+i){delete TF[t];TYPES.splice(i,1);saveTF();armed=null;saveT();toast("險種已刪除");draw()}else{armed="t"+i;draw();setTimeout(()=>{if(armed==="t"+i){armed=null;draw()}},4000)}}
const TABS=[["home","首頁"],["c","客戶"],["p","保單"],["r","提醒"],["m","更多"]];
function draw(){document.getElementById("nav").innerHTML=TABS.map(([k,l])=>`<button class="${tab===k||(k==="m"&&"hloysb".includes(tab))?"on":""}" onclick="go('${k}')">${l}</button>`).join("");
 document.getElementById("app").innerHTML=({home,c:custs,h:fam,p:pols,r:rem,l:logs,o:opps,y:pays,b:bak,m:more,s:setts})[tab]();if(tab==="c")drawList();if(tab==="p")drawPols();if(tab==="l")drawLogs()}
function go(k){tab=k;armed=null;draw();scrollTo(0,0)}
draw();
</script></body></html>
