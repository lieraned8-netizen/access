<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>工地門禁卡／磁扣借還管理系統</title>
<style>
:root{
  --navy-950:#0f1b2d;
  --navy-900:#132538;
  --navy-800:#1a3049;
  --navy-700:#234064;
  --steel-600:#3d5a80;
  --steel-400:#6c8bad;
  --paper:#f4f6f8;
  --paper-2:#ffffff;
  --line:#dde3ea;
  --ink:#1c2733;
  --ink-dim:#5b6b7c;
  --amber:#c8862a;
  --amber-bg:#fdf1de;
  --green:#2f8f5b;
  --green-bg:#e6f5ec;
  --red:#c23b3b;
  --red-bg:#fbe9e9;
  --grey:#6b7684;
  --grey-bg:#eceff2;
  --yellow:#a67c00;
  --yellow-bg:#fdf3d9;
  --radius:8px;
  --shadow:0 1px 2px rgba(15,27,45,.06), 0 1px 6px rgba(15,27,45,.05);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font);
  background:var(--paper);
  color:var(--ink);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:15px;}

/* ---------- Layout shell ---------- */
#app{display:flex;min-height:100vh;}

.sidebar{
  width:220px;
  flex-shrink:0;
  background:var(--navy-950);
  color:#c7d3e0;
  display:flex;
  flex-direction:column;
  position:fixed;
  top:0;left:0;bottom:0;
  z-index:50;
  transition:transform .25s ease;
}
.sidebar-header{
  padding:20px 18px 14px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.sidebar-header .site-name{font-size:15px;font-weight:700;color:#fff;line-height:1.35;}
.sidebar-header .proj-name{font-size:12px;color:var(--steel-400);margin-top:3px;}
.nav-list{list-style:none;margin:0;padding:10px 0;flex:1;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 18px;
  font-size:14px;
  color:#aebdd0;
  cursor:pointer;
  border-left:3px solid transparent;
  white-space:nowrap;
}
.nav-item .ic{width:18px;text-align:center;font-size:15px;}
.nav-item:hover{background:rgba(255,255,255,.04);color:#fff;}
.nav-item.active{
  background:var(--navy-800);
  color:#fff;
  border-left-color:var(--amber);
  font-weight:600;
}
.sidebar-foot{padding:12px 18px;font-size:11px;color:#5c6c80;border-top:1px solid rgba(255,255,255,.08);}

.main{
  margin-left:220px;
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}
.topbar{
  background:var(--paper-2);
  border-bottom:1px solid var(--line);
  padding:14px 24px;
  display:flex;
  align-items:center;
  gap:14px;
  position:sticky;top:0;z-index:30;
}
.topbar h1{font-size:18px;margin:0;font-weight:700;color:var(--navy-950);}
.menu-toggle{
  display:none;
  background:none;border:none;font-size:20px;color:var(--navy-950);padding:4px 6px;
}
.topbar-search{
  margin-left:auto;
  display:flex;align-items:center;gap:8px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:999px;
  padding:7px 14px;
  min-width:240px;
}
.topbar-search input{border:none;background:transparent;outline:none;flex:1;font-size:14px;}
.content{padding:20px 24px 60px;max-width:1400px;}

/* ---------- Cards / generic ---------- */
.panel{
  background:var(--paper-2);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px;border-bottom:1px solid var(--line);
  flex-wrap:wrap;gap:10px;
}
.panel-head h2{font-size:16px;margin:0;font-weight:700;}
.panel-body{padding:18px;}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:14px;
  margin-bottom:22px;
}
.stat-card{
  background:var(--paper-2);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px 16px 14px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}
.stat-card .num{font-size:28px;font-weight:800;color:var(--navy-950);line-height:1.1;}
.stat-card .lbl{font-size:12.5px;color:var(--ink-dim);margin-top:6px;}
.stat-card .bar{position:absolute;left:0;top:0;bottom:0;width:4px;}
.stat-card.s-total .bar{background:var(--steel-600);}
.stat-card.s-avail .bar{background:var(--green);}
.stat-card.s-out .bar{background:var(--amber);}
.stat-card.s-overdue .bar{background:var(--red);}
.stat-card.s-in .bar{background:var(--steel-400);}
.stat-card.s-outn .bar{background:var(--yellow);}

.btn{
  border:1px solid var(--line);
  background:var(--paper-2);
  color:var(--ink);
  padding:9px 16px;
  border-radius:6px;
  font-size:14px;
  font-weight:600;
  display:inline-flex;align-items:center;gap:6px;
  transition:background .12s, border-color .12s;
}
.btn:hover{background:var(--paper);}
.btn-primary{background:var(--navy-900);border-color:var(--navy-900);color:#fff;}
.btn-primary:hover{background:var(--navy-800);}
.btn-amber{background:var(--amber);border-color:var(--amber);color:#fff;}
.btn-amber:hover{filter:brightness(1.06);}
.btn-red{background:var(--red);border-color:var(--red);color:#fff;}
.btn-red:hover{filter:brightness(1.08);}
.btn-green{background:var(--green);border-color:var(--green);color:#fff;}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:5px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-icon{padding:7px 9px;}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;}
.toolbar input[type=text], .toolbar select, .toolbar input[type=date]{
  border:1px solid var(--line);border-radius:6px;padding:8px 11px;background:#fff;font-size:14px;min-width:120px;
}
.toolbar .grow{flex:1;min-width:180px;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{
  text-align:left;background:var(--paper);color:var(--ink-dim);
  font-weight:700;font-size:12.5px;
  padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
tbody tr:hover{background:#fafbfc;}
.table-wrap{overflow-x:auto;}
.empty-row td{text-align:center;color:var(--ink-dim);padding:36px 12px;}

.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;
}
.badge .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
.badge-avail{background:var(--green-bg);color:var(--green);}
.badge-avail .dot{background:var(--green);}
.badge-out{background:var(--amber-bg);color:var(--amber);}
.badge-out .dot{background:var(--amber);}
.badge-overdue{background:var(--red-bg);color:var(--red);}
.badge-overdue .dot{background:var(--red);}
.badge-disabled{background:var(--grey-bg);color:var(--grey);}
.badge-disabled .dot{background:var(--grey);}
.badge-lost{background:var(--red-bg);color:var(--red);}
.badge-lost .dot{background:var(--red);}
.badge-broken{background:var(--yellow-bg);color:var(--yellow);}
.badge-broken .dot{background:var(--yellow);}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(15,27,45,.45);
  display:none;align-items:flex-start;justify-content:center;
  padding:40px 16px;overflow-y:auto;z-index:100;
}
.overlay.show{display:flex;}
.modal{
  background:#fff;border-radius:10px;max-width:560px;width:100%;
  box-shadow:0 12px 40px rgba(0,0,0,.25);
  animation:pop .15s ease;
}
@keyframes pop{from{transform:translateY(6px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{margin:0;font-size:16px;}
.modal-close{background:none;border:none;font-size:20px;color:var(--ink-dim);padding:2px 6px;}
.modal-body{padding:20px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:16px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-grid.one{grid-template-columns:1fr;}
.field{display:flex;flex-direction:column;gap:5px;}
.field.full{grid-column:1/-1;}
.field label{font-size:12.5px;font-weight:700;color:var(--ink-dim);}
.field input,.field select,.field textarea{
  border:1px solid var(--line);border-radius:6px;padding:9px 11px;font-size:14px;background:#fff;
}
.field textarea{resize:vertical;min-height:60px;}
.help{font-size:11.5px;color:var(--ink-dim);}
.checkbox-list{display:flex;flex-wrap:wrap;gap:8px;max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;padding:10px;}
.checkbox-list label{display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 8px;border-radius:5px;background:var(--paper);cursor:pointer;}
.checkbox-list label:has(input:checked){background:var(--amber-bg);}

.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{
  background:var(--navy-950);color:#fff;padding:12px 18px;border-radius:8px;font-size:13.5px;
  box-shadow:0 6px 20px rgba(0,0,0,.25);min-width:220px;animation:slidein .2s ease;
}
.toast.err{background:var(--red);}
.toast.ok{background:var(--green);}
@keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}

.section-note{font-size:13px;color:var(--ink-dim);margin-bottom:14px;}
.pill-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.pill-tab{
  padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--ink-dim);
}
.pill-tab.active{background:var(--navy-900);color:#fff;border-color:var(--navy-900);}

.overdue-banner{
  background:var(--red-bg);border:1px solid #f1c3c3;color:var(--red);
  padding:10px 14px;border-radius:8px;font-size:13.5px;font-weight:600;margin-bottom:14px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}

.kv-grid{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:14px;}
.kv-grid dt{color:var(--ink-dim);}
.kv-grid dd{margin:0;font-weight:600;}

.stat-report{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px;}
@media (max-width:900px){.stat-report{grid-template-columns:1fr;}}
.report-block h3{font-size:14px;margin:0 0 10px;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px;}
.bar-row .name{width:110px;flex-shrink:0;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-row .track{flex:1;background:var(--paper);border-radius:4px;height:10px;overflow:hidden;}
.bar-row .fill{height:100%;background:var(--steel-600);border-radius:4px;}
.bar-row .val{width:34px;text-align:right;font-weight:700;flex-shrink:0;}

@media (max-width:860px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .menu-toggle{display:inline-flex;}
  .form-grid{grid-template-columns:1fr;}
  .topbar-search{min-width:0;flex:1;}
  .topbar h1{font-size:16px;}
}
.overlay-bg-close{cursor:pointer;}

@media print{
  .sidebar,.topbar,.toolbar,.no-print,.overlay{display:none !important;}
  .main{margin-left:0;}
  body{background:#fff;}
  .panel{box-shadow:none;border:none;}
  .content{padding:0;}
}
</style>
</head>
<body>
<div id="app">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="site-name" id="cfgSiteName">○○建案</div>
      <div class="proj-name" id="cfgProjName">○○新建工程・驗屋階段</div>
    </div>
    <ul class="nav-list" id="navList">
      <li class="nav-item" data-page="dashboard"><span class="ic">🏠</span>儀表板</li>
      <li class="nav-item" data-page="equipment"><span class="ic">🔑</span>門禁設備</li>
      <li class="nav-item" data-page="areas"><span class="ic">📍</span>門禁區域</li>
      <li class="nav-item" data-page="borrow"><span class="ic">📝</span>新增借用</li>
      <li class="nav-item" data-page="current"><span class="ic">📤</span>目前借出</li>
      <li class="nav-item" data-page="history"><span class="ic">📋</span>借還紀錄</li>
      <li class="nav-item" data-page="vendors"><span class="ic">🏢</span>廠商管理</li>
      <li class="nav-item" data-page="reports"><span class="ic">📊</span>統計報表</li>
      <li class="nav-item" data-page="settings"><span class="ic">⚙️</span>系統設定</li>
    </ul>
    <div class="sidebar-foot">門禁磁扣借還管理系統 v1.0</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <h1 id="pageTitle">儀表板</h1>
      <div class="topbar-search">
        <span>🔍</span>
        <input type="text" id="globalSearch" placeholder="搜尋設備編號、樓層、廠商、借用人…">
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalBox"></div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
(function(){
"use strict";

/* ===================== 資料層 ===================== */
const DB_KEY = "accessCardSystem_v1";
const uid = ()=> 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);

function defaultDB(){
  const areas = [];
  for(let f=1; f<=21; f++){
    const code = String(f).padStart(2,'0')+'F';
    areas.push({id:uid(), code:code, name:code, type:'樓層', description:'第'+f+'層樓', active:true});
  }
  areas.push({id:uid(), code:'ENG', name:'全棟工程區', type:'工程', description:'可使用全棟21層之工程卡專屬區域', active:true});

  const equipment = [];
  areas.filter(a=>a.type==='樓層').forEach(area=>{
    for(let m=1;m<=3;m++){
      equipment.push({
        id:uid(),
        code: area.code+'-M0'+m,
        type:'磁扣',
        areaId: area.id,
        usageScope: area.code,
        status:'可借用',
        note:'',
        createdAt: new Date().toISOString()
      });
    }
  });
  const engArea = areas.find(a=>a.code==='ENG');
  for(let i=1;i<=32;i++){
    equipment.push({
      id:uid(),
      code:'ENG-'+String(i).padStart(3,'0'),
      type:'工程卡',
      areaId: engArea.id,
      usageScope:'全棟21F',
      status:'可借用',
      note:'',
      createdAt:new Date().toISOString()
    });
  }

  const vendors = [
    {id:uid(),name:'業主',contact:'',phone:'',note:'',active:true},
    {id:uid(),name:'監造',contact:'',phone:'',note:'',active:true},
    {id:uid(),name:'驗屋廠商',contact:'',phone:'',note:'',active:true},
  ];

  return {
    equipment, areas, vendors,
    borrowRecords: [],
    settings:{
      siteName:'○○建案',
      projectName:'○○新建工程',
      manageUnit:'工地辦公室',
      overdueMinutes: 480, // 預設逾期判定：8小時
      defaultBorrowTime: '', // blank = now
      defaultReturnTime: '' // blank = +N hours later handled separately
    },
    meta:{ initializedAt: new Date().toISOString(), version:1 }
  };
}

let DB = load();
function load(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      // basic shape safety
      if(parsed && parsed.equipment && parsed.areas) return parsed;
    }
  }catch(e){ console.warn('load failed', e); }
  const fresh = defaultDB();
  localStorage.setItem(DB_KEY, JSON.stringify(fresh));
  return fresh;
}
function save(){
  localStorage.setItem(DB_KEY, JSON.stringify(DB));
}

/* ===================== 工具 ===================== */
function pad2(n){ return String(n).padStart(2,'0'); }
function fmtDate(d){
  const x = (d instanceof Date)? d : new Date(d);
  return x.getFullYear()+'-'+pad2(x.getMonth()+1)+'-'+pad2(x.getDate());
}
function fmtTime(d){
  const x = (d instanceof Date)? d : new Date(d);
  return pad2(x.getHours())+':'+pad2(x.getMinutes());
}
function nowDate(){ return fmtDate(new Date()); }
function nowTime(){ return fmtTime(new Date()); }
function combineDT(dateStr, timeStr){
  if(!dateStr) return null;
  return new Date(dateStr+'T'+(timeStr||'00:00')+':00');
}
function areaName(areaId){
  const a = DB.areas.find(x=>x.id===areaId);
  return a? a.name : '未指定';
}
function vendorName(vendorId, fallback){
  if(vendorId==='OTHER') return fallback || '其他';
  const v = DB.vendors.find(x=>x.id===vendorId);
  return v? v.name : (fallback || '未知廠商');
}
function equipmentByCode(code){ return DB.equipment.find(e=>e.code===code); }
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function isOverdue(rec){
  if(rec.status!=='借出中') return false;
  if(!rec.expectedReturnDate || !rec.expectedReturnTime) return false;
  const expected = combineDT(rec.expectedReturnDate, rec.expectedReturnTime);
  return expected && (new Date() > expected);
}
function overdueMinutesOf(rec){
  const expected = combineDT(rec.expectedReturnDate, rec.expectedReturnTime);
  if(!expected) return 0;
  return Math.floor((new Date() - expected)/60000);
}

function toast(msg, kind){
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast'+(kind? ' '+kind:'');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 2600);
}

function statusBadge(status){
  const map = {
    '可借用':['badge-avail','可借用'],
    '借出中':['badge-out','借出中'],
    '逾期未還':['badge-overdue','逾期未還'],
    '停用':['badge-disabled','停用'],
    '遺失':['badge-lost','遺失'],
    '故障':['badge-broken','故障']
  };
  const m = map[status] || ['badge-disabled', status];
  return '<span class="badge '+m[0]+'"><span class="dot"></span>'+m[1]+'</span>';
}

/* ===================== 路由 / 畫面切換 ===================== */
const PAGE_TITLES = {
  dashboard:'儀表板', equipment:'門禁設備管理', areas:'門禁區域管理', borrow:'新增借用',
  current:'目前借出', history:'借還紀錄', vendors:'廠商管理', reports:'統計報表', settings:'系統設定'
};
let currentPage = 'dashboard';
let globalSearchTerm = '';

document.getElementById('navList').addEventListener('click', (e)=>{
  const item = e.target.closest('.nav-item');
  if(!item) return;
  navigate(item.dataset.page);
  document.getElementById('sidebar').classList.remove('open');
});
function navigate(page){
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n=> n.classList.toggle('active', n.dataset.page===page));
  document.getElementById('pageTitle').textContent = PAGE_TITLES[page] || '';
  render();
}

document.getElementById('menuToggle').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('open');
});

let searchDebounce;
document.getElementById('globalSearch').addEventListener('input', (e)=>{
  clearTimeout(searchDebounce);
  const val = e.target.value.trim();
  searchDebounce = setTimeout(()=>{
    globalSearchTerm = val;
    if(val && currentPage!=='history'){ navigate('history'); }
    else render();
  }, 250);
});

/* ===================== Modal 輔助 ===================== */
function openModal(html, onMount){
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
  if(onMount) onMount(document.getElementById('modalBox'));
}
function closeModal(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('modalBox').innerHTML='';
}
document.getElementById('overlay').addEventListener('click',(e)=>{
  if(e.target.id==='overlay') closeModal();
});

/* ===================== 逾期同步 ===================== */
function syncOverdue(){
  let changed = false;
  DB.borrowRecords.forEach(rec=>{
    if(rec.status==='借出中' && isOverdue(rec)){
      rec.status = '逾期未還';
      changed = true;
    }
  });
  if(changed) save();
}

/* ===================== render 主流程 ===================== */
function render(){
  syncOverdue();
  const el = document.getElementById('content');
  switch(currentPage){
    case 'dashboard': el.innerHTML = renderDashboard(); bindDashboard(); break;
    case 'equipment': el.innerHTML = renderEquipment(); bindEquipment(); break;
    case 'areas': el.innerHTML = renderAreas(); bindAreas(); break;
    case 'borrow': el.innerHTML = renderBorrow(); bindBorrow(); break;
    case 'current': el.innerHTML = renderCurrent(); bindCurrent(); break;
    case 'history': el.innerHTML = renderHistory(); bindHistory(); break;
    case 'vendors': el.innerHTML = renderVendors(); bindVendors(); break;
    case 'reports': el.innerHTML = renderReports(); break;
    case 'settings': el.innerHTML = renderSettings(); bindSettings(); break;
    default: el.innerHTML = '<p>找不到頁面</p>';
  }
}

/* ===================== 儀表板 ===================== */
function renderDashboard(){
  const total = DB.equipment.filter(e=>e.status!=='停用').length;
  const avail = DB.equipment.filter(e=>e.status==='可借用').length;
  const outCount = DB.borrowRecords.filter(r=>r.status==='借出中'||r.status==='逾期未還').length;
  const overdue = DB.borrowRecords.filter(r=>r.status==='逾期未還').length;
  const today = nowDate();
  const todayBorrow = DB.borrowRecords.filter(r=>r.date===today).length;
  const todayReturn = DB.borrowRecords.filter(r=>r.returnDate===today).length;

  const overdueList = DB.borrowRecords.filter(r=>r.status==='逾期未還').slice(0,5);

  let overdueHtml = '';
  if(overdueList.length){
    overdueHtml = '<div class="overdue-banner">⚠ 目前有 '+overdue+' 筆逾期未還，請儘速處理：&nbsp;'
      + overdueList.map(r=>{
          const eq = DB.equipment.find(e=>e.id===r.equipmentId);
          const mins = overdueMinutesOf(r);
          const hrs = Math.floor(mins/60), rem = mins%60;
          const label = hrs>0 ? hrs+'小時'+rem+'分' : rem+'分';
          return (eq?eq.code:'?')+'（逾期 '+label+'）';
        }).join('、') + '</div>';
  }

  const recent = DB.borrowRecords.slice().sort((a,b)=> (b.borrowTs||0)-(a.borrowTs||0)).slice(0,8);

  return `
  <div class="stat-grid">
    <div class="stat-card s-total"><div class="bar"></div><div class="num">${total}</div><div class="lbl">門禁設備總數</div></div>
    <div class="stat-card s-avail"><div class="bar"></div><div class="num">${avail}</div><div class="lbl">可借用</div></div>
    <div class="stat-card s-out"><div class="bar"></div><div class="num">${outCount}</div><div class="lbl">借出中</div></div>
    <div class="stat-card s-overdue"><div class="bar"></div><div class="num">${overdue}</div><div class="lbl">逾期／異常</div></div>
    <div class="stat-card s-in"><div class="bar"></div><div class="num">${todayBorrow}</div><div class="lbl">今日借用</div></div>
    <div class="stat-card s-outn"><div class="bar"></div><div class="num">${todayReturn}</div><div class="lbl">今日歸還</div></div>
  </div>
  ${overdueHtml}
  <div class="panel">
    <div class="panel-head">
      <h2>最新借還動態</h2>
      <button class="btn btn-primary no-print" data-goto="borrow">＋ 新增借用</button>
    </div>
    <div class="panel-body table-wrap">
      <table>
        <thead><tr><th>日期</th><th>設備編號</th><th>門禁區域</th><th>借用廠商</th><th>借用人</th><th>狀態</th></tr></thead>
        <tbody>
        ${recent.length? recent.map(r=>{
          const eq = DB.equipment.find(e=>e.id===r.equipmentId);
          return '<tr><td>'+r.date+'</td><td>'+(eq?eq.code:'-')+'</td><td>'+(eq?areaName(eq.areaId):'-')+'</td><td>'+vendorName(r.vendorId,r.vendorOther)+'</td><td>'+escapeHtml(r.borrower)+'</td><td>'+statusBadge(r.status)+'</td></tr>';
        }).join('') : '<tr class="empty-row"><td colspan="6">尚無借還紀錄</td></tr>'}
        </tbody>
      </table>
    </div>
  </div>`;
}

  document.querySelectorAll('[data-goto]').forEach(b=> b.addEventListener('click', ()=> navigate(b.dataset.goto)) );
}

function bindEquipment(){
  document.getElementById('btnAddEquipment').addEventListener('click', ()=> openEquipmentModal(null));

  document.getElementById('eqAreaFilter').value = eqFilter.area;
  document.getElementById('eqAreaFilter').addEventListener('change', e=>{ eqFilter.area = e.target.value; render(); });
  document.getElementById('eqTypeFilter').value = eqFilter.type;
  document.getElementById('eqTypeFilter').addEventListener('change', e=>{ eqFilter.type = e.target.value; render(); });
  document.getElementById('eqStatusFilter').value = eqFilter.status;

function restoreFocus(id){
  const elx = document.getElementById(id);
  if(elx){ elx.focus(); const v=elx.value; elx.value=''; elx.value=v; }
}
function openEquipmentModal(id){
  const editing = id? DB.equipment.find(e=>e.id===id) : null;
  const activeAreas = DB.areas.filter(a=>a.active || (editing && editing.areaId===a.id));
  const areaOpts = activeAreas.map(a=>'<option value="'+a.id+'" '+((editing&&editing.areaId===a.id)?'selected':'')+'>'+escapeHtml(a.name)+'</option>').join('');
  openModal(`
    <div class="modal-head"><h3>${editing? '編輯門禁設備' : '新增門禁設備'}</h3><button class="modal-close" id="mClose">✕</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field"><label>設備編號 *</label><input type="text" id="fCode" value="${editing?escapeHtml(editing.code):''}" placeholder="例如 PUB-001"></div>
        <div class="field"><label>設備類型 *</label>
          <select id="fType">
            <option value="磁扣" ${editing&&editing.type==='磁扣'?'selected':''}>磁扣</option>
            <option value="工程卡" ${editing&&editing.type==='工程卡'?'selected':''}>工程卡</option>

          <select id="fStatus">
            ${['可借用','借出中','停用','遺失','故障'].map(s=>'<option value="'+s+'" '+((editing&&editing.status===s)?'selected':(!editing&&s==='可借用'?'selected':''))+'>'+s+'</option>').join('')}
          </select>

        </div>
        <div class="field full"><label>備註</label><textarea id="fNote">${editing?escapeHtml(editing.note||''):''}</textarea></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="mCancel">取消</button>
      <button class="btn btn-primary" id="mSave">儲存</button>
    </div>
  `, ()=>{
    document.getElementById('mClose').addEventListener('click', closeModal);
    document.getElementById('mCancel').addEventListener('click', closeModal);
    document.getElementById('mSave').addEventListener('click', ()=>{
      const code = document.getElementById('fCode').value.trim();
      if(!code){ toast('請輸入設備編號','err'); return; }
      const dup = DB.equipment.find(e=> e.code===code && (!editing || e.id!==editing.id));
      if(dup){ toast('此設備編號已存在','err'); return; }
      const type = document.getElementById('fType').value;
      const areaId = document.getElementById('fArea').value;
      const scope = document.getElementById('fScope').value.trim();
      const status = document.getElementById('fStatus').value;
      const note = document.getElementById('fNote').value.trim();
      if(editing){
        editing.code=code; editing.type=type; editing.areaId=areaId; editing.usageScope=scope; editing.status=status; editing.note=note;
        toast('已更新設備資料','ok');

        DB.equipment.push({id:uid(),code,type,areaId,usageScope:scope,status,note,createdAt:new Date().toISOString()});
        toast('已新增設備','ok');
      }
      save(); closeModal(); render();
    });
  });
}

function bindBorrow(){
  const vendorSel = document.getElementById('fVendor');
  const otherWrap = document.getElementById('otherVendorWrap');
  vendorSel.addEventListener('change', ()=>{ otherWrap.style.display = vendorSel.value==='OTHER' ? 'flex':'none'; });

  document.getElementById('btnSubmitBorrow').addEventListener('click', ()=>{
    const checked = Array.from(document.querySelectorAll('.eqCheck:checked')).map(c=>c.value);
    if(checked.length===0){ toast('請至少選擇一項門禁設備','err'); return; }
    const vendorId = document.getElementById('fVendor').value;
    if(!vendorId){ toast('請選擇借用廠商','err'); return; }
    const vendorOther = document.getElementById('fVendorOther').value.trim();
    if(vendorId==='OTHER' && !vendorOther){ toast('請輸入其他廠商名稱','err'); return; }
    const borrower = document.getElementById('fBorrower').value.trim();
    if(!borrower){ toast('請輸入借用人姓名','err'); return; }
    const date = document.getElementById('fDate').value || nowDate();
    const time = document.getElementById('fTime').value || nowTime();
    const expDate = document.getElementById('fExpDate').value;
    const expTime = document.getElementById('fExpTime').value;
    const note = document.getElementById('fNote').value.trim();

    let successCount = 0;
    checked.forEach(eqId=>{
      const eq = DB.equipment.find(e=>e.id===eqId);
      if(!eq || eq.status!=='可借用'){
        toast('此門禁設備目前已借出，無法再次借用。（'+(eq?eq.code:eqId)+'）','err');
        return;
      }
      const rec = {
        id: uid(),
        equipmentId: eq.id,
        date, vendorId, vendorOther,
        borrower,
        borrowTime: time,
        borrowTs: combineDT(date,time) ? combineDT(date,time).getTime() : Date.now(),
        expectedReturnDate: expDate || '',
        expectedReturnTime: expTime || '',
        returnDate:'', returnTime:'', returnCondition:'',
        status:'借出中',
        note
      };
      DB.borrowRecords.push(rec);
      eq.status = '借出中';
      successCount++;
    });
    if(successCount>0){
      save();
      toast('已成功登記借用 '+successCount+' 項設備','ok');
      navigate('current');
    }
  });
}

function exportCsv(){
  const headers = ['日期','設備編號','設備類型','門禁區域','借用廠商','借用人','借用時間','預計歸還','歸還時間','狀態','備註'];
  const rows = DB.borrowRecords.map(r=>{
    const eq = DB.equipment.find(e=>e.id===r.equipmentId);
    return [
      r.date, eq?eq.code:'', eq?eq.type:'', eq?areaName(eq.areaId):'',
      vendorName(r.vendorId,r.vendorOther), r.borrower, r.borrowTime,
      r.expectedReturnDate? r.expectedReturnDate+' '+r.expectedReturnTime : '',
      r.returnDate? r.returnDate+' '+r.returnTime : '',
      r.status, (r.note||'').replace(/\n/g,' ')
    ];
  });
  let csv = '\uFEFF' + headers.join(',') + '\n';
  rows.forEach(row=>{
    csv += row.map(v=> '"'+String(v).replace(/"/g,'""')+'"').join(',') + '\n';
  });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '門禁借還紀錄_'+nowDate()+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  toast('已匯出 CSV 檔案','ok');
}

function renderReports(){
  const vendorCounts = {};
  DB.borrowRecords.forEach(r=>{
    const name = vendorName(r.vendorId, r.vendorOther);
    vendorCounts[name] = (vendorCounts[name]||0)+1;
  });
  const areaCounts = {};
  DB.borrowRecords.forEach(r=>{
    const eq = DB.equipment.find(e=>e.id===r.equipmentId);
    if(!eq) return;
    const name = areaName(eq.areaId);
    areaCounts[name] = (areaCounts[name]||0)+1;
  });
  const equipCounts = {};
  DB.borrowRecords.forEach(r=>{
    const eq = DB.equipment.find(e=>e.id===r.equipmentId);
    if(!eq) return;
    equipCounts[eq.code] = (equipCounts[eq.code]||0)+1;
  });
  const lost = DB.borrowRecords.filter(r=>r.status==='遺失').length;
  const broken = DB.borrowRecords.filter(r=>r.status==='損壞').length;
  const fault = DB.borrowRecords.filter(r=>r.status==='故障').length;

  function bars(obj, top){
    const entries = Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0, top||8);
    const max = entries.length? entries[0][1] : 1;
    if(!entries.length) return '<div class="help">尚無資料</div>';
    return entries.map(([k,v])=>`
      <div class="bar-row">
        <div class="name" title="${escapeHtml(k)}">${escapeHtml(k)}</div>
        <div class="track"><div class="fill" style="width:${Math.round(v/max*100)}%"></div></div>
        <div class="val">${v}</div>
      </div>`).join('');
  }

  return `
  <div class="panel">
    <div class="panel-head"><h2>統計報表</h2></div>
    <div class="panel-body">
      <div class="stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:8px;">
        <div class="stat-card s-overdue"><div class="bar"></div><div class="num">${lost}</div><div class="lbl">遺失件數</div></div>
        <div class="stat-card s-out"><div class="bar"></div><div class="num">${broken}</div><div class="lbl">損壞件數</div></div>
        <div class="stat-card s-outn"><div class="bar"></div><div class="num">${fault}</div><div class="lbl">故障件數</div></div>
        <div class="stat-card s-total"><div class="bar"></div><div class="num">${DB.borrowRecords.length}</div><div class="lbl">累計借用次數</div></div>
      </div>
      <div class="stat-report">
        <div class="report-block"><h3>各廠商借用次數</h3>${bars(vendorCounts)}</div>
        <div class="report-block"><h3>各區域使用次數</h3>${bars(areaCounts)}</div>
        <div class="report-block"><h3>設備使用率（前 10 名）</h3>${bars(equipCounts,10)}</div>
      </div>
    </div>
  </div>`;
}

        <dt>區域總數</dt><dd>${DB.areas.length}</dd>
        <dt>廠商總數</dt><dd>${DB.vendors.length}</dd>
        <dt>借還紀錄</dt><dd>${DB.borrowRecords.length}</dd>
        <dt>初始化時間</dt><dd>${DB.meta && DB.meta.initializedAt ? new Date(DB.meta.initializedAt).toLocaleString('zh-TW') : '-'}</dd>
      </dl>
    </div>
  </div>`;
}
function bindSettings(){
  document.getElementById('btnSaveSettings').addEventListener('click', ()=>{
    DB.settings.siteName = document.getElementById('sSite').value.trim() || '未命名工地';
    DB.settings.projectName = document.getElementById('sProj').value.trim();
    DB.settings.manageUnit = document.getElementById('sUnit').value.trim();
    DB.settings.overdueMinutes = parseInt(document.getElementById('sOverdue').value,10) || 0;
    save();
    applyHeaderLabels();
    toast('設定已儲存','ok');
  });
  document.getElementById('btnExportBackup').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '門禁系統備份_'+nowDate()+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    toast('已匯出備份檔','ok');
  });
  const fileInput = document.getElementById('fileImport');
  document.getElementById('btnImportBackup').addEventListener('click', ()=> fileInput.click());
  fileInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (evt)=>{
      try{
        const incoming = JSON.parse(evt.target.result);
        if(!incoming.equipment || !incoming.areas || !incoming.borrowRecords){
          toast('備份檔格式不正確','err'); return;
        }
        mergeImport(incoming);
        toast('備份資料已匯入（已避免重複）','ok');
        render();
      }catch(err){
        toast('讀取備份檔失敗：'+err.message,'err');
      }
      fileInput.value='';
    };
    reader.readAsText(file);
  });
}
function mergeImport(incoming){
  // merge by unique key to avoid duplicates: equipment by code, areas by code, vendors by name, borrowRecords by id
  const existingEqCodes = new Set(DB.equipment.map(e=>e.code));
  (incoming.equipment||[]).forEach(e=>{
    if(!existingEqCodes.has(e.code)){ DB.equipment.push(e); existingEqCodes.add(e.code); }
  });
  const existingAreaCodes = new Set(DB.areas.map(a=>a.code));
  (incoming.areas||[]).forEach(a=>{
    if(!existingAreaCodes.has(a.code)){ DB.areas.push(a); existingAreaCodes.add(a.code); }
  });
  const existingVendorNames = new Set(DB.vendors.map(v=>v.name));
  (incoming.vendors||[]).forEach(v=>{
    if(!existingVendorNames.has(v.name)){ DB.vendors.push(v); existingVendorNames.add(v.name); }
  });
  const existingRecIds = new Set(DB.borrowRecords.map(r=>r.id));
  (incoming.borrowRecords||[]).forEach(r=>{
    if(!existingRecIds.has(r.id)){ DB.borrowRecords.push(r); existingRecIds.add(r.id); }
  });
  save();
}

/* ===================== 標頭套用設定 ===================== */
function applyHeaderLabels(){
  document.getElementById('cfgSiteName').textContent = DB.settings.siteName || '未命名工地';
  document.getElementById('cfgProjName').textContent = (DB.settings.projectName||'') + (DB.settings.projectName?'・':'') + '驗屋階段';
}

/* ===================== 逾期輪詢 ===================== */
setInterval(()=>{
  syncOverdue();
  if(currentPage==='dashboard' || currentPage==='current'){ render(); }
}, 60000);

/* ===================== 事件委派：panel-head 上的新增鈕已個別綁定 ===================== */

/* ===================== 初始化 ===================== */
applyHeaderLabels();
navigate('dashboard');

})();
</script>
